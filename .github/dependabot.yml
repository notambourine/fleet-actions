version: 2
updates:
  # Monthly updates avoid daily botocore churn. Security updates use their own schedule.
  - package-ecosystem: uv
    directory: /tools/guarddog
    schedule:
      interval: cron
      cronjob: "0 9 1 * *"
      timezone: America/Chicago
    cooldown:
      default-days: 3
    groups:
      guarddog:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # The actionlint image pin lives in a one-line Dockerfile because github-actions
  # updates never touch a docker:// reference or the image inside a third-party action.yml.
  - package-ecosystem: docker
    directory: /tools/actionlint
    schedule:
      interval: cron
      cronjob: "0 9 * * 1,3"
      timezone: America/Chicago
    cooldown:
      default-days: 3

  # Same reason as actionlint: an image reference is invisible to github-actions updates,
  # and vet-action's own version input is a string no updater rewrites.
  - package-ecosystem: docker
    directory: /tools/vet
    schedule:
      interval: cron
      cronjob: "0 9 * * 1,3"
      timezone: America/Chicago
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * 1,3"
      timezone: America/Chicago
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
