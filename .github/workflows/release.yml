name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-v1
  cancel-in-progress: false

jobs:
  self-test:
    permissions:
      contents: read
    uses: ./.github/workflows/self-test.yml

  release:
    needs: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag, publish, and promote v1
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          stable() { grep -E '^v1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1; }
          # A rerun after a partial failure resumes with the tag it already created.
          TAG=$(git tag --points-at "$SHA" | stable || true)
          LAST=$(git tag --merged "$SHA" --no-contains "$SHA" | stable)
          if [ -z "$TAG" ]; then
            IFS=. read -r _ MINOR PATCH <<<"$LAST"
            inputs() { git show "$1:.github/workflows/fleet-ci.yml" | yq -o=json '.on.workflow_call.inputs'; }
            if [ "$(inputs "$LAST")" != "$(inputs "$SHA")" ]; then
              TAG="v1.$((MINOR + 1)).0"
            else
              TAG="v1.$MINOR.$((PATCH + 1))"
            fi
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          fi

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Generated notes carry pull request titles only. A note added under
            # docs/release-notes is the one place a caller learns it must change something.
            gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > generated.md
            git diff --name-only --diff-filter=A "$LAST" "$SHA" -- 'docs/release-notes/*.md' |
              while read -r note; do cat "$note"; echo; done > notes.md
            cat generated.md >> notes.md
            gh release create "$TAG" --repo "$REPO" --verify-tag --notes-file notes.md --title "$TAG"
          fi

          NEWEST=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/v1." --jq '.[].ref' |
            sed 's|^refs/tags/||' | stable)
          if [ "$NEWEST" != "$TAG" ]; then
            echo "Skipping v1: a newer release exists"; exit 0
          fi
          gh api -X PATCH "repos/$REPO/git/refs/tags/v1" -f sha="$SHA" -F force=true >/dev/null
          echo "v1 -> $SHA ($TAG)"
