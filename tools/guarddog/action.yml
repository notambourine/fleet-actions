name: guarddog
description: >-
  Run DataDog GuardDog from a hash-pinned install: offline YARA over the tracked tree
  and a scan of the actions the workflows reference. Findings fail the job.
author: NoTambourine LLC
branding:
  icon: search
  color: orange

inputs:
  local-scan:
    description: >-
      Run the ecosystem's YARA rules over the tracked tree. Offline: no registry, no
      metadata lookups.
    default: "true"
  actions:
    description: >-
      Scan the JavaScript of the actions each workflow references. This is code that
      runs with the workflow's token, and it is fetched from GitHub.
    default: "true"
  registry-verify:
    description: >-
      Also download and score every declared dependency. Off because Socket and the
      update bots already cover that surface for the cost of a registry round trip
      per package.
    default: "false"
  ecosystems:
    description: >-
      "auto" picks every ecosystem whose manifest the tree holds, or name a subset:
      npm, pypi, go, crates, rubygems. The workflow scan has its own toggle.
    default: auto
  scan-paths:
    description: >-
      Paths to scan in place, one per line, untracked included: `node_modules` after an
      install. `<ecosystem>:<path>` picks the rule set, a bare path runs every selected
      ecosystem over it.
    default: ""
  exclude-paths:
    description: >-
      Paths kept out of the scan, one glob per line, matched against tracked
      repo-relative paths. `*` crosses `/`, so `dist/*` drops the subtree. guarddog
      itself has no ignore file, baseline, or path allowlist; this is that.
    default: ""
  exclude-rules:
    description: >-
      Rules to drop, one per line. A bare name applies to every ecosystem scanned;
      guarddog validates names per ecosystem, so scope one with `pypi:<rule>`.
    default: ""
  exclude-packages:
    description: >-
      Packages whose verify findings are dropped before scoring, one per line:
      `<name>`, `<name>@<version>`, or `<ecosystem|github_action>:<name>`. `*` globs.
      Verify only, since a local scan reports files rather than packages.
    default: ""
  include-dev-dependencies:
    description: Add npm devDependencies to a registry verify, which reads `dependencies` only.
    default: "false"
  sandbox:
    description: >-
      Keep guarddog's kernel sandbox (Landlock) around archive extraction and YARA.
      Setting false runs untrusted package code unsandboxed.
    default: "true"
  minimum-risk:
    description: Lowest risk label that fails the action, low, suspicious, or high.
    default: suspicious
  python-version:
    description: Interpreter uv provisions. Must satisfy pyproject.toml.
    default: "3.12"

outputs:
  version:
    description: The guarddog release that ran, e.g. 3.2.0.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        working-directory: ${{ github.action_path }}
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
        python-version: ${{ inputs.python-version }}

    - name: Install guarddog
      id: install
      shell: bash
      env:
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/guarddog-venv
      run: |
        set -euo pipefail
        uv audit --project "$GITHUB_ACTION_PATH" --locked --no-dev
        uv sync --project "$GITHUB_ACTION_PATH" --locked --no-dev --no-build
        resolved=$("$UV_PROJECT_ENVIRONMENT/bin/guarddog" --version)
        printf 'version=%s\n' "$resolved" >> "$GITHUB_OUTPUT"
        printf 'bin=%s\n' "$UV_PROJECT_ENVIRONMENT/bin/guarddog" >> "$GITHUB_OUTPUT"
        echo "guarddog $resolved installed from the pinned tree"

    - name: guarddog verify
      shell: bash
      env:
        GD_BIN: ${{ steps.install.outputs.bin }}
        GD_ECOSYSTEMS: ${{ inputs.ecosystems }}
        GD_LOCAL_SCAN: ${{ inputs.local-scan }}
        GD_ACTIONS: ${{ inputs.actions }}
        GD_REGISTRY_VERIFY: ${{ inputs.registry-verify }}
        GD_SCAN_PATHS: ${{ inputs.scan-paths }}
        GD_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        GD_EXCLUDE_RULES: ${{ inputs.exclude-rules }}
        GD_EXCLUDE_PACKAGES: ${{ inputs.exclude-packages }}
        GD_INCLUDE_DEV: ${{ inputs.include-dev-dependencies }}
        GD_SANDBOX: ${{ inputs.sandbox }}
        GD_MINIMUM_RISK: ${{ inputs.minimum-risk }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/run-guarddog.sh"
