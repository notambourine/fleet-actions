version: 2
updates:
  - package-ecosystem: uv
    directory: /tools/guarddog
    schedule:
      interval: cron
      cronjob: "0 9 * * *"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    groups:
      guarddog:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # The actionlint image pin lives in a one-line Dockerfile because github-actions
  # updates never touch a docker:// reference or the image inside a third-party action.yml.
  - package-ecosystem: docker
    directory: /tools/actionlint
    schedule:
      interval: cron
      cronjob: "0 9 * * *"
      timezone: America/Chicago
    cooldown:
      default-days: 7

  # Same reason as actionlint: the upstream release assets carry no reference an updater
  # rewrites, so the image digest is the only pin Dependabot can hold for betterleaks.
  - package-ecosystem: docker
    directory: /tools/betterleaks
    schedule:
      interval: cron
      cronjob: "0 9 * * *"
      timezone: America/Chicago
    cooldown:
      default-days: 7

  # Same reason as actionlint: an image reference is invisible to github-actions updates,
  # and vet-action's own version input is a string no updater rewrites.
  - package-ecosystem: docker
    directory: /tools/vet
    schedule:
      interval: cron
      cronjob: "0 9 * * *"
      timezone: America/Chicago
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * *"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
