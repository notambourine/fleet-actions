# Suite coverage marker.
name: vet
description: >-
  Check declared dependencies for known advisories and malware with a digest-pinned vet image.
author: NoTambourine LLC
branding:
  icon: shield
  color: green

inputs:
  severity:
    description: >-
      Minimum advisory severity. none checks malware only.
    default: high
  malware:
    description: Also fail on a package OSV marks malicious (a MAL- identifier).
    default: "true"
  policy:
    description: >-
      Repo-relative filter suite. Replaces severity and malware.
    default: ""
  exclude:
    description: Paths kept out of the scan, one vet exclusion pattern per line.
    default: ""
  cloud-key:
    description: >-
      SafeDep API key. Scans against authenticated Insights instead of the community
      endpoint. Needs cloud-tenant.
    default: ""
  cloud-tenant:
    description: SafeDep tenant domain. Needs cloud-key.
    default: ""

runs:
  using: docker
  image: Dockerfile
  env:
    VET_SEVERITY: ${{ inputs.severity }}
    VET_MALWARE: ${{ inputs.malware }}
    VET_POLICY: ${{ inputs.policy }}
    VET_EXCLUDE: ${{ inputs.exclude }}
    VET_CLOUD_KEY: ${{ inputs.cloud-key }}
    VET_CLOUD_TENANT: ${{ inputs.cloud-tenant }}
