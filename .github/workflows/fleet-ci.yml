name: fleet-ci

on:
  workflow_call:
    inputs:
      betterleaks:
        description: Secret scan over history or tree.
        type: boolean
        default: true
      zizmor:
        description: Workflow audit, medium severity and above.
        type: boolean
        default: true
      actionlint:
        description: Workflow static check with ShellCheck and pyflakes.
        type: boolean
        default: true
      dashes:
        description: Unicode dash ratchet on pull requests.
        type: boolean
        default: true
      tripwire:
        description: Shai-Hulud worm fail-fast gate.
        type: boolean
        default: true
      wormhook:
        description: npm supply-chain malware scan.
        type: boolean
        default: true
      pnpm-pin:
        description: Assert package.json declares packageManager.
        type: boolean
        default: true
      vet:
        description: >-
          Check declared dependencies for known advisories and malware. Disabled by default
          because keyless SafeDep enriches one package at a time, so a tree with a thousand
          dependencies outlasts this job's budget and takes every other gate's verdict with
          it. Supply vet-cloud-tenant and the VET_CLOUD_KEY secret to lift the ceiling.
        type: boolean
        default: false
      pin-osv:
        description: >-
          Check action and base-image source commits against OSV. Uses one keyless query per pin.
        type: boolean
        default: true
      guarddog:
        description: >-
          Scan tracked files and referenced actions with GuardDog. Disabled by default because
          action scans fetch source and rule updates require a pin bump.
        type: boolean
        default: false
      runner-tier:
        description: >-
          Suggest clear ubuntu-slim cost savings in private repositories. Never fails the job.
        type: boolean
        default: false

      scan-mode:
        description: betterleaks subcommand, git or dir. git fingerprints commits.
        type: string
        default: git
      wormhook-mode:
        description: >-
          wormhook scan depth, fast or deep. deep forces the Tier-2 node_modules content walk;
          it no-ops when the directory is absent, so it only costs a repo that commits the tree.
          fleet-ci never installs, so a repo wanting real Tier-2 runs wormhook again after npm ci.
        type: string
        default: deep
      fetch-depth:
        description: Checkout depth. betterleaks git needs the full history.
        type: number
        default: 0
      betterleaks-path:
        description: Path to scan. Empty scans the workspace root.
        type: string
        default: ""
      betterleaks-log-opts:
        description: git log arguments narrowing a git scan, e.g. "--no-merges A..B". Beats pr-range.
        type: string
        default: ""
      betterleaks-pr-range:
        description: On pull_request, scan only the pull request's commits.
        type: boolean
        default: false

      dash-base-ref:
        description: Base branch for the ratchet, without the origin/ prefix. Empty resolves it from the event.
        type: string
        default: ""
      dash-exclude:
        description: Newline-separated glob pathspecs added to the built-in hold-out list.
        type: string
        default: ""
      dash-exclude-defaults:
        description: Gate the built-in hold-out paths like everything else when false.
        type: boolean
        default: true
      dash-force-zero:
        description: Assert the tree carries no dash instead of ratcheting.
        type: boolean
        default: false

      tripwire-allow:
        description: >-
          Globs whose CONTENT may carry IOC literals, such as a security README. Filename,
          hash, and lifecycle checks are never exempted.
        type: string
        default: ""

      vet-severity:
        description: >-
          Lowest advisory severity that fails the job, cumulative: high covers critical.
          none gates on malware alone.
        type: string
        default: high
      vet-malware:
        description: >-
          Also fail on a package OSV marks malicious. Overlaps wormhook on npm and reaches
          the ecosystems wormhook does not.
        type: boolean
        default: true
      vet-policy:
        description: >-
          Repo-relative vet filter suite. Replaces vet-severity and vet-malware.
        type: string
        default: ""
      vet-exclude:
        description: Paths kept out of the scan, one vet exclusion pattern per line.
        type: string
        default: ""
      vet-cloud-tenant:
        description: >-
          SafeDep tenant domain. Pairs with the VET_CLOUD_KEY secret to scan against
          authenticated Insights instead of the community endpoint.
        type: string
        default: ""

      pin-osv-severity:
        description: >-
          Minimum advisory severity. Unrated records count as critical. none checks malware only.
        type: string
        default: high
      pin-osv-malware:
        description: Also fail on a MAL- identifier at a pinned commit.
        type: boolean
        default: true
      pin-osv-actions:
        description: "Query the commit behind each `uses: owner/repo@<sha>` pin."
        type: boolean
        default: true
      pin-osv-images:
        description: Query the commit behind each digest-pinned Dockerfile FROM.
        type: boolean
        default: true
      pin-osv-require-attestation:
        description: >-
          Fail when an image build attestation cannot be read. Otherwise emit a warning.
        type: boolean
        default: false
      pin-osv-allow:
        description: OSV identifiers to waive, one per line.
        type: string
        default: ""
      pin-osv-exclude:
        description: Pin references kept out of the scan, one glob per line.
        type: string
        default: ""

      guarddog-local-scan:
        description: Run the YARA rules over the tracked tree. Offline, no registry traffic.
        type: boolean
        default: true
      guarddog-actions:
        description: Fetch and scan JavaScript from referenced actions.
        type: boolean
        default: true
      guarddog-registry-verify:
        description: >-
          Download and score every declared dependency. Disabled by default.
        type: boolean
        default: false
      guarddog-ecosystems:
        description: >-
          auto detects ecosystems from manifests. Or list npm, pypi, go, crates, or rubygems.
        type: string
        default: auto
      guarddog-exclude-paths:
        description: Excluded path globs, one per line. `*` crosses `/`.
        type: string
        default: ""
      guarddog-exclude-rules:
        description: >-
          Rules to drop, one per line. Bare names apply to every ecosystem scanned; scope one
          with pypi:<rule>.
        type: string
        default: ""
      guarddog-exclude-packages:
        description: >-
          Packages whose verify findings are dropped before scoring, one per line: <name>,
          <name>@<version>, or <ecosystem|github_action>:<name>. `*` globs.
        type: string
        default: ""
      guarddog-include-dev-dependencies:
        description: Add npm devDependencies to a registry verify, which reads dependencies only.
        type: boolean
        default: false
      guarddog-sandbox:
        description: >-
          Keep guarddog's kernel sandbox around archive extraction and analysis. False runs
          untrusted package code unsandboxed.
        type: boolean
        default: true
      guarddog-minimum-risk:
        description: Lowest GuardDog risk label that fails the job, low, suspicious, or high.
        type: string
        default: suspicious

      runner-tier-exclude:
        description: Job-key globs omitted from runner-tier suggestions, one per line.
        type: string
        default: ""

      actionlint-extra-labels:
        description: Newline-separated runner labels this repo uses beyond the fleet set.
        type: string
        default: ""
      actionlint-require-permissions:
        description: >-
          Scope at which a workflow must declare token permissions: job, workflow, or off.
          job covers jobs calling a reusable workflow. Neither scope judges whether the
          grants are minimal.
        type: string
        default: job
      actionlint-job-timeout-min:
        description: >-
          Lowest timeout-minutes a job may declare, 5 through 60, or 0 to drop the bound.
          A job with no timeout-minutes fails any bound; a job calling a reusable workflow
          is exempt, since a caller-side timeout does not apply to it.
        type: number
        default: 5
      actionlint-job-timeout-max:
        description: >-
          Highest timeout-minutes a job may declare, 5 through 60, or 0 to drop the bound.
          The fleet default matches ubuntu-slim's own 15-minute kill.
        type: number
        default: 15
      actionlint-config-extra:
        description: Raw actionlint config YAML merged over the fleet config and the caller's own file.
        type: string
        default: ""

    secrets:
      VET_CLOUD_KEY:
        description: SafeDep API key. Needs vet-cloud-tenant; vet fails without it.
        required: false

permissions:
  contents: read

concurrency:
  group: fleet-ci-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false

      - name: betterleaks
        if: ${{ inputs.betterleaks && !cancelled() }}
        uses: $/tools/betterleaks
        with:
          scan: ${{ inputs.scan-mode }}
          path: ${{ inputs.betterleaks-path }}
          log-opts: ${{ inputs.betterleaks-log-opts }}
          pr-range: ${{ inputs.betterleaks-pr-range }}

      # The action vendors a version-to-digest table, so this sha pins the zizmor image itself.
      # uvx resolved zizmor and its tree from PyPI at run time, which no bot could gate.
      - name: zizmor workflow audit
        if: ${{ inputs.zizmor && !cancelled() }}
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          inputs: .github/workflows
          min-severity: medium
          # SARIF upload would need security-events: write from every caller and would move
          # findings off the fleet check. Fail the job instead.
          advanced-security: false
          online-audits: false
          annotations: true

      - name: fleet actionlint config
        if: ${{ inputs.actionlint && !cancelled() }}
        env:
          EXTRA_LABELS: ${{ inputs.actionlint-extra-labels }}
          CONFIG_EXTRA: ${{ inputs.actionlint-config-extra }}
          REQUIRE_PERMISSIONS: ${{ inputs.actionlint-require-permissions }}
          TIMEOUT_MIN: ${{ inputs.actionlint-job-timeout-min }}
          TIMEOUT_MAX: ${{ inputs.actionlint-job-timeout-max }}
        run: |
          case "$REQUIRE_PERMISSIONS" in
            job)      PERMISSIONS="{scope: job}" ;;
            workflow) PERMISSIONS="true" ;;
            off)      PERMISSIONS="" ;;
            *) echo "::error::actionlint-require-permissions was '$REQUIRE_PERMISSIONS', not job, workflow, or off"; exit 1 ;;
          esac

          BOUNDS=()
          if [ "$TIMEOUT_MIN" -gt 0 ]; then BOUNDS+=("min-minutes: $TIMEOUT_MIN"); fi
          if [ "$TIMEOUT_MAX" -gt 0 ]; then BOUNDS+=("max-minutes: $TIMEOUT_MAX"); fi

          {
            echo "self-hosted-runner:"
            echo "  labels:"
            echo "    - ubuntu-slim"
            # Avoid a false final loop test under bash -e.
            printf '%s\n' "$EXTRA_LABELS" | while IFS= read -r label; do
              if [ -n "$label" ]; then echo "    - $label"; fi
            done
            # An empty policy mapping is a config error, so emit the key only when it has one.
            if [ -n "$PERMISSIONS" ] || [ ${#BOUNDS[@]} -gt 0 ]; then
              echo "policy:"
              if [ -n "$PERMISSIONS" ]; then echo "  require-permissions: $PERMISSIONS"; fi
              if [ ${#BOUNDS[@]} -gt 0 ]; then
                printf '  require-job-timeout: {%s}\n' "$(IFS=,; echo "${BOUNDS[*]}")"
              fi
            fi
          } > "${RUNNER_TEMP}/fleet.yml"

          # config-file disables actionlint's default config discovery.
          SOURCES=("${RUNNER_TEMP}/fleet.yml")
          for candidate in .github/actionlint.yaml .github/actionlint.yml; do
            if [ -f "$candidate" ]; then SOURCES+=("$candidate"); break; fi
          done
          if [ -n "$CONFIG_EXTRA" ]; then
            printf '%s\n' "$CONFIG_EXTRA" > "${RUNNER_TEMP}/extra.yml"
            SOURCES+=("${RUNNER_TEMP}/extra.yml")
          fi

          # `*+` appends arrays; later documents win scalar conflicts.
          # The Docker action resolves config-file inside /github/workspace.
          # shellcheck disable=SC2016 # the yq expression is not shell interpolation
          yq eval-all '. as $doc ireduce ({}; . *+ $doc)' "${SOURCES[@]}" \
            > "${GITHUB_WORKSPACE}/.actionlint-fleet.yml"
          cat "${GITHUB_WORKSPACE}/.actionlint-fleet.yml"
      - name: actionlint
        if: ${{ inputs.actionlint && !cancelled() }}
        uses: $/tools/actionlint
        with:
          format: github
          config-file: .actionlint-fleet.yml

      - name: runner-tier
        if: ${{ inputs.runner-tier && !cancelled() }}
        uses: $/tools/runner-tier
        with:
          exclude: ${{ inputs.runner-tier-exclude }}

      - name: dashes
        if: ${{ inputs.dashes && !cancelled() }}
        uses: $/tools/dashes
        with:
          base-ref: ${{ inputs.dash-base-ref }}
          exclude: ${{ inputs.dash-exclude }}
          exclude-defaults: ${{ inputs.dash-exclude-defaults }}
          force-zero: ${{ inputs.dash-force-zero }}

      - name: tripwire
        if: ${{ inputs.tripwire && !cancelled() }}
        uses: $/tools/tripwire
        with:
          allow-globs: ${{ inputs.tripwire-allow }}

      - name: wormhook
        if: ${{ inputs.wormhook && !cancelled() }}
        uses: notambourine/wormhook@1270e6a1e7dc2fad0a0abe738a1c56c6e6496cff # v0.31.1
        with:
          mode: ${{ inputs.wormhook-mode }}

      - name: vet
        if: ${{ inputs.vet && !cancelled() }}
        uses: $/tools/vet
        with:
          severity: ${{ inputs.vet-severity }}
          malware: ${{ inputs.vet-malware }}
          policy: ${{ inputs.vet-policy }}
          exclude: ${{ inputs.vet-exclude }}
          cloud-key: ${{ secrets.VET_CLOUD_KEY }}
          cloud-tenant: ${{ inputs.vet-cloud-tenant }}

      - name: pin-osv
        if: ${{ inputs.pin-osv && !cancelled() }}
        uses: $/tools/pin-osv
        with:
          severity: ${{ inputs.pin-osv-severity }}
          malware: ${{ inputs.pin-osv-malware }}
          actions: ${{ inputs.pin-osv-actions }}
          images: ${{ inputs.pin-osv-images }}
          require-attestation: ${{ inputs.pin-osv-require-attestation }}
          allow: ${{ inputs.pin-osv-allow }}
          exclude: ${{ inputs.pin-osv-exclude }}

      - name: guarddog
        if: ${{ inputs.guarddog && !cancelled() }}
        uses: $/tools/guarddog
        with:
          local-scan: ${{ inputs.guarddog-local-scan }}
          actions: ${{ inputs.guarddog-actions }}
          registry-verify: ${{ inputs.guarddog-registry-verify }}
          ecosystems: ${{ inputs.guarddog-ecosystems }}
          exclude-paths: ${{ inputs.guarddog-exclude-paths }}
          exclude-rules: ${{ inputs.guarddog-exclude-rules }}
          exclude-packages: ${{ inputs.guarddog-exclude-packages }}
          include-dev-dependencies: ${{ inputs.guarddog-include-dev-dependencies }}
          sandbox: ${{ inputs.guarddog-sandbox }}
          minimum-risk: ${{ inputs.guarddog-minimum-risk }}

      - name: pnpm-pin
        if: ${{ inputs.pnpm-pin && !cancelled() }}
        uses: $/tools/pnpm-pin
