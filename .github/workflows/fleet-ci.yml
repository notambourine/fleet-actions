name: fleet-ci

# The fleet's CI surface as one reusable workflow. Call sites and inputs:
# https://github.com/notambourine/fleet-actions
on:
  workflow_call:
    inputs:
      betterleaks:
        description: Secret scan over history or tree.
        type: boolean
        default: true
      zizmor:
        description: Workflow audit, medium severity and above.
        type: boolean
        default: true
      actionlint:
        description: Workflow static check with ShellCheck and pyflakes.
        type: boolean
        default: true
      dashes:
        description: Unicode dash ratchet on pull requests.
        type: boolean
        default: true
      tripwire:
        description: Shai-Hulud worm fail-fast gate.
        type: boolean
        default: true
      wormhook:
        description: npm supply-chain malware scan.
        type: boolean
        default: true
      pnpm-pin:
        description: Assert package.json declares packageManager.
        type: boolean
        default: true

      scan-mode:
        description: betterleaks subcommand, git or dir. git fingerprints commits.
        type: string
        default: git
      fetch-depth:
        description: Checkout depth. betterleaks git needs the full history.
        type: number
        default: 0

      dash-base-ref:
        description: Base branch for the ratchet, without the origin/ prefix. Empty resolves it from the event.
        type: string
        default: ""
      dash-exclude:
        description: Newline-separated glob pathspecs added to the built-in hold-out list.
        type: string
        default: ""
      dash-exclude-defaults:
        description: Gate the built-in hold-out paths like everything else when false.
        type: boolean
        default: true
      dash-force-zero:
        description: Assert the tree carries no dash instead of ratcheting.
        type: boolean
        default: false

      actionlint-extra-labels:
        description: Newline-separated runner labels this repo uses beyond the fleet set.
        type: string
        default: ""
      actionlint-config-extra:
        description: Raw actionlint config YAML merged over the fleet config and the caller's own file.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # github.repository and github.workflow are the CALLER's here, so one group per
  # calling repo, calling workflow, and ref. Without github.workflow, two caller
  # workflows that both call fleet-ci share a group and cancel each other.
  group: fleet-ci-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job, tools as steps. Seven jobs meant seven runner spin-ups and seven
  # checkouts per commit in every consumer, and a skipped job never reports, so a
  # consumer running a subset had no stable set of check names to require. One job
  # whose STEPS skip always reports one name.
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # One checkout serves everything: depth 0 is a superset of betterleaks' full
      # history and of the dash ratchet's depth 2, which exists only to reach HEAD^1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false

      # !cancelled() on every gate: without it one failing tool hides every tool
      # after it, and chaining turns a fan-out into whack-a-mole.
      - name: betterleaks
        if: ${{ inputs.betterleaks && !cancelled() }}
        run: |
          echo "::error::betterleaks is not in fleet-ci yet. Keep this repo's own betterleaks job and pass betterleaks: false."
          exit 1

      - id: cache-week
        if: ${{ inputs.zizmor && !cancelled() }}
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: ${{ inputs.zizmor && !cancelled() }}
        with:
          # This step runs only `uvx zizmor`, so the repo's own dependency files are
          # not its inputs and the default glob would key the tool cache on them.
          cache-dependency-glob: ""
          # zizmor floats: rotate weekly, or the first entry freezes and every later
          # release downloads anyway while the stale one keeps restoring.
          cache-suffix: ${{ steps.cache-week.outputs.week }}
      - name: zizmor workflow audit
        if: ${{ inputs.zizmor && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx zizmor --min-severity=medium .github/workflows

      - name: fleet actionlint config
        if: ${{ inputs.actionlint && !cancelled() }}
        env:
          EXTRA_LABELS: ${{ inputs.actionlint-extra-labels }}
          CONFIG_EXTRA: ${{ inputs.actionlint-config-extra }}
        run: |
          # actionlint rejects runner labels it does not know, and the fleet's cheap
          # tier is newer than its built-in list. The label list describes the
          # CALLER's workflows, which may still target ubuntu-slim.
          {
            echo "self-hosted-runner:"
            echo "  labels:"
            echo "    - ubuntu-slim"
            # `if`, not `&&`: a false test as the loop's last command exits the
            # pipeline non-zero, which `bash -e` treats as a step failure.
            printf '%s\n' "$EXTRA_LABELS" | while IFS= read -r label; do
              if [ -n "$label" ]; then echo "    - $label"; fi
            done
          } > "${RUNNER_TEMP}/fleet.yml"

          # config-file OVERRIDES the default path, so a caller with an existing
          # .github/actionlint.yaml would silently lose it and see its suppressed
          # findings return as failures. Merge it instead of replacing it.
          SOURCES=("${RUNNER_TEMP}/fleet.yml")
          for candidate in .github/actionlint.yaml .github/actionlint.yml; do
            if [ -f "$candidate" ]; then SOURCES+=("$candidate"); break; fi
          done
          if [ -n "$CONFIG_EXTRA" ]; then
            printf '%s\n' "$CONFIG_EXTRA" > "${RUNNER_TEMP}/extra.yml"
            SOURCES+=("${RUNNER_TEMP}/extra.yml")
          fi

          # `*+` deep-merges and APPENDS arrays, so label lists union rather than the
          # last document winning. Later documents win on scalars, so the caller's
          # file and then the input override the fleet defaults.
          # The workspace, not RUNNER_TEMP: the Docker action joins config-file onto
          # /github/workspace, so an absolute host path resolves under the mount and
          # is never found.
          # shellcheck disable=SC2016 # the yq expression is not shell interpolation
          yq eval-all '. as $doc ireduce ({}; . *+ $doc)' "${SOURCES[@]}" \
            > "${GITHUB_WORKSPACE}/.actionlint-fleet.yml"
          cat "${GITHUB_WORKSPACE}/.actionlint-fleet.yml"
      # Resolved from the floating v1.15 tag, whose action.yml pins the image BY DIGEST.
      # A `# v1.15.1` label would mean the sha came from the release tag, which leaves
      # the image on a mutable GHCR tag.
      - uses: kjanat/actionlint@e7434e3127c1c4645bad1d6476f48d4b52a29c29 # v1.15
        if: ${{ inputs.actionlint && !cancelled() }}
        with:
          format: github
          config-file: .actionlint-fleet.yml

      # $/ resolves to this repo at the ref the caller pinned, so the tool runs from
      # the same commit as the workflow without vendoring it into the caller's tree.
      - name: dashes
        if: ${{ inputs.dashes && !cancelled() }}
        uses: $/tools/dashes
        with:
          base-ref: ${{ inputs.dash-base-ref }}
          exclude: ${{ inputs.dash-exclude }}
          exclude-defaults: ${{ inputs.dash-exclude-defaults }}
          force-zero: ${{ inputs.dash-force-zero }}

      - name: tripwire
        if: ${{ inputs.tripwire && !cancelled() }}
        run: |
          echo "::error::tripwire is not in fleet-ci yet. Keep this repo's own shai-hulud-tripwire call and pass tripwire: false."
          exit 1

      - name: wormhook
        if: ${{ inputs.wormhook && !cancelled() }}
        run: |
          echo "::error::wormhook is not in fleet-ci yet. Pass wormhook: false."
          exit 1

      - name: pnpm-pin
        if: ${{ inputs.pnpm-pin && !cancelled() }}
        run: |
          echo "::error::pnpm-pin is not in fleet-ci yet. Pass pnpm-pin: false."
          exit 1
