# Suite coverage marker.
name: pin-osv
description: >-
  Check action and base-image source commits for OSV advisories and malware.
author: NoTambourine LLC
branding:
  icon: git-commit
  color: red

inputs:
  severity:
    description: >-
      Minimum advisory severity. Unrated records count as critical. none checks malware only.
    default: high
  malware:
    description: Also fail on a MAL- identifier at the pinned commit.
    default: "true"
  actions:
    description: "Query the commit behind each `uses: owner/repo@<sha>` pin."
    default: "true"
  images:
    description: Query the commit behind each digest-pinned Dockerfile FROM.
    default: "true"
  require-attestation:
    description: >-
      Fail when an image build attestation cannot be read. Otherwise emit a warning.
    default: "false"
  allow:
    description: OSV identifiers to waive, one per line.
    default: ""
  exclude:
    description: Pin references kept out of the scan, one glob per line.
    default: ""
  token:
    description: Token used to read build attestations. Needs no scope beyond public read.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PINOSV_SEVERITY: ${{ inputs.severity }}
        PINOSV_MALWARE: ${{ inputs.malware }}
        PINOSV_ACTIONS: ${{ inputs.actions }}
        PINOSV_IMAGES: ${{ inputs.images }}
        PINOSV_REQUIRE_ATTESTATION: ${{ inputs.require-attestation }}
        PINOSV_ALLOW: ${{ inputs.allow }}
        PINOSV_EXCLUDE: ${{ inputs.exclude }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/run-pin-osv.sh"
