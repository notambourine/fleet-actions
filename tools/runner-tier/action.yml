# Suite coverage marker.
name: runner-tier
description: >-
  Find ubuntu-latest jobs that can use ubuntu-slim. Reads workflow files offline.
author: NoTambourine LLC
branding:
  icon: dollar-sign
  color: gray-dark
inputs:
  files:
    description: Repo-relative workflow paths, one per line. Empty scans .github/workflows.
    default: ""
  exclude:
    description: >-
      Excluded job-key globs, one per line. Use an ubuntu-slim comment for a single job.
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RUNNER_TIER_FILES: ${{ inputs.files }}
        RUNNER_TIER_EXCLUDE: ${{ inputs.exclude }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/check-runner-tier.sh"
