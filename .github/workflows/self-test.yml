name: self-test

# fleet-ci gates its own repo, and each absorbed tool runs its own suite only when
# its directory changed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fleet-ci:
    uses: ./.github/workflows/fleet-ci.yml
    with:
      # Absorbed in step 2.
      betterleaks: false
      tripwire: false
      wormhook: false
      pnpm-pin: false
      # Absorbed in step 4.
      dashes: false

  actionlint-pin:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: kjanat/actionlint pin resolves to a digest-pinned image
        run: |
          # dependabot.yml ignores this action, which also suppresses its security
          # advisories. The trade is only sound while the pinned commit keeps the
          # Docker image on a digest. Assert that instead of trusting the comment.
          PIN=$(grep -oE 'kjanat/actionlint@[0-9a-f]{40}' .github/workflows/fleet-ci.yml |
            head -1 | cut -d@ -f2)
          if [ -z "$PIN" ]; then
            echo "::error::no 40-char kjanat/actionlint pin found in fleet-ci.yml"; exit 1
          fi
          IMAGE=$(curl -fsSL "https://raw.githubusercontent.com/kjanat/actionlint/$PIN/action.yml" |
            sed -n 's/^[[:space:]]*image:[[:space:]]*//p')
          echo "kjanat/actionlint@$PIN image: $IMAGE"
          case "$IMAGE" in
            *@sha256:*) ;;
            *) echo "::error::pinned action.yml image is not digest-pinned: $IMAGE"; exit 1 ;;
          esac
          if ! grep -q 'dependency-name: kjanat/actionlint' .github/dependabot.yml; then
            echo "::error::dependabot.yml no longer ignores kjanat/actionlint; drop this assertion too"
            exit 1
          fi

  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      tools: ${{ steps.detect.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # An unborn or force-pushed base leaves nothing to diff against; test everything.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            CHANGED=$(git ls-files)
          else
            CHANGED=$(git diff --no-renames --name-only "$BASE" HEAD)
          fi
          TOOLS=$(printf '%s\n' "$CHANGED" |
            sed -n 's|^tools/\([^/]*\)/.*|\1|p' | sort -u |
            while IFS= read -r tool; do
              if [ -d "tools/$tool" ]; then
                printf '%s\n' "$tool"
              fi
            done |
            jq -R . | jq -sc .)
          echo "tools=$TOOLS" >> "$GITHUB_OUTPUT"
          echo "changed tool suites: $TOOLS"

  tools:
    needs: changes
    if: needs.changes.outputs.tools != '[]'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.changes.outputs.tools) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ${{ matrix.tool }} suite
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          # Absorbing a tool means dropping in its suite here; this job needs no edit.
          if [ ! -x "tools/$TOOL/test/run.sh" ]; then
            echo "::error::tools/$TOOL has no executable test/run.sh"; exit 1
          fi
          "tools/$TOOL/test/run.sh"
