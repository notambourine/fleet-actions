# Dependabot - fleet convention (twice-weekly cron, cooldown-gated).
# Cadence: Mon & Wed 09:00 America/Chicago. Cooldown aligns the proposer
# with the install-time age gate so it can't PR a release the gate blocks;
# CVE security advisories bypass cooldown and still fast-track.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * 1,3"
      timezone: America/Chicago
    cooldown:
      default-days: 3
    ignore:
      # kjanat/actionlint is pinned to a commit whose action.yml pins the Docker
      # image BY DIGEST. Dependabot bumps to a release tag, and that tag's
      # action.yml may carry a mutable GHCR tag instead, silently trading a
      # digest pin for a floating image. ignore also suppresses SECURITY
      # advisories for this action: accepted, and covered instead by the
      # digest-pin assertion in self-test.yml, which fails if the pin ever
      # resolves to a non-digest image.
      - dependency-name: kjanat/actionlint
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # A groups: block defaults to version-updates only, so without this stanza
      # every advisory opens its own PR regardless of the repo's UI toggle.
      security:
        applies-to: security-updates
        patterns:
          - "*"
