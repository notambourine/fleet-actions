name: betterleaks secret scan
description: >-
  Run betterleaks against the checked-out repository from a digest-pinned image.
author: NoTambourine LLC
branding:
  icon: eye-off
  color: red

inputs:
  scan:
    description: >-
      "git" walks commit history and needs fetch-depth: 0; "dir" scans the worktree only.
    required: false
    default: git
  path:
    description: Path to scan. Defaults to the workspace root.
    required: false
    default: ""
  confidence:
    description: Minimum confidence for a finding to fail the job (low, medium, high).
    required: false
    default: medium
  redact:
    description: Percent of each matched secret to redact in the log (0-100).
    required: false
    default: "100"
  log-opts:
    description: >-
      git log arguments narrowing a "git" scan, e.g. "--no-merges A..B". Takes
      precedence over pr-range.
    required: false
    default: ""
  pr-range:
    description: On pull_request, scan only the pull request's commits.
    required: false
    default: "false"

runs:
  using: docker
  image: Dockerfile
  env:
    BL_SCAN: ${{ inputs.scan }}
    BL_PATH: ${{ inputs.path }}
    BL_CONFIDENCE: ${{ inputs.confidence }}
    BL_REDACT: ${{ inputs.redact }}
    BL_LOG_OPTS: ${{ inputs.log-opts }}
    BL_PR_RANGE: ${{ inputs.pr-range }}
    BL_PR_BASE: ${{ github.event.pull_request.base.sha }}
    BL_PR_HEAD: ${{ github.event.pull_request.head.sha }}
