name: release

# Cutting a release is `git tag v1.N && git push origin v1.N`. This moves the floating
# v1 that consumers resolve their pin from. The v1.* pattern never matches v1 itself,
# so moving it cannot retrigger this workflow.
on:
  push:
    tags: ["v1.*"]

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: move v1 and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          TAG_SHA=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          if [ "$TAG_SHA" != "$SHA" ]; then
            echo "::error::$TAG no longer points to $SHA"; exit 1
          fi
          STATUS=$(gh api "repos/$REPO/compare/$SHA...main" --jq .status)
          if [ "$STATUS" != ahead ] && [ "$STATUS" != identical ]; then
            echo "::error::$SHA is not on main"; exit 1
          fi
          PASSED=$(gh api --method GET "repos/$REPO/actions/workflows/self-test.yml/runs" \
            -f head_sha="$SHA" -f branch=main -f event=push -f per_page=1 \
            --jq '.workflow_runs[0] | .status == "completed" and .conclusion == "success"')
          if [ "$PASSED" != true ]; then
            echo "::error::$SHA needs a successful self-test push run on main before release"; exit 1
          fi

          # PATCH fails when v1 does not exist yet, so fall back to creating it.
          gh api -X PATCH "repos/$REPO/git/refs/tags/v1" -f sha="$SHA" -F force=true ||
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/v1 -f sha="$SHA"
          gh release create "$TAG" --repo "$REPO" --generate-notes --title "$TAG"
          echo "v1 -> $SHA ($TAG)"
