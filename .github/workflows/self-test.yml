name: self-test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 11 * * 1,4"

permissions:
  contents: read

jobs:
  fleet-ci:
    permissions:
      contents: read
    uses: ./.github/workflows/fleet-ci.yml
    with:
      dash-exclude-defaults: false
      guarddog: true # Opt-in for callers, so only the self-test covers the gate.
      runner-tier: true # Same: opt-in for callers, so this is the only clean-case coverage.

  betterleaks-self-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/betterleaks

  actionlint-planted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plant a workflow with a known error
        run: |
          mkdir -p planted
          # An unknown event and an unknown checkout input. No expression syntax here: the
          # runner would expand it before the file is written.
          cat > planted/bad.yml <<'EOF'
          on: pushh
          jobs:
            bad:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                  with:
                    no-such-input: true
          EOF
      - id: lint
        continue-on-error: true
        uses: ./tools/actionlint
        with:
          files: planted/bad.yml
          shellcheck: "false"
          pyflakes: "false"
      - name: Assert the planted error failed the action
        env:
          OUTCOME: ${{ steps.lint.outcome }}
          RESULT: ${{ steps.lint.outputs.result }}
          COUNT: ${{ steps.lint.outputs.problem-count }}
        run: |
          echo "outcome=$OUTCOME result=$RESULT problems=$COUNT"
          [ "$OUTCOME" = failure ] || { echo "::error::action passed a planted error"; exit 1; }
          [ "$RESULT" = problems-found ] || { echo "::error::result was $RESULT, not problems-found"; exit 1; }
          [ "${COUNT:-0}" -ge 1 ] || { echo "::error::problem-count was '$COUNT'"; exit 1; }
      - name: Plant a workflow the fleet policy defaults reject
        run: |
          # Correct in every other respect: only the missing permissions and the
          # out-of-range timeout may fail it.
          cat > planted/policy.yml <<'EOF'
          on: push
          jobs:
            uncapped:
              runs-on: ubuntu-latest
              timeout-minutes: 120
              steps:
                - run: echo hi
          EOF
          cat > planted/policy-config.yml <<'EOF'
          policy:
            require-permissions: {scope: job}
            require-job-timeout: {min-minutes: 5, max-minutes: 15}
          EOF
      - id: policy
        continue-on-error: true
        uses: ./tools/actionlint
        with:
          files: planted/policy.yml
          config-file: planted/policy-config.yml
          shellcheck: "false"
          pyflakes: "false"
      - name: Assert the policy caught both
        env:
          OUTCOME: ${{ steps.policy.outcome }}
          OUTPUT: ${{ steps.policy.outputs.output }}
        run: |
          printf '%s\n' "$OUTPUT"
          [ "$OUTCOME" = failure ] || { echo "::error::policy passed a job with no permissions and a 120m timeout"; exit 1; }
          printf '%s' "$OUTPUT" | grep -q permissions || { echo "::error::no permissions finding"; exit 1; }
          printf '%s' "$OUTPUT" | grep -q timeout || { echo "::error::no timeout finding"; exit 1; }

  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tools: ${{ steps.detect.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            CHANGED=$(git ls-files)
          else
            CHANGED=$(git diff --no-renames --name-only "$BASE" HEAD)
          fi
          TOOLS=$(printf '%s\n' "$CHANGED" |
            sed -n 's|^tools/\([^/]*\)/.*|\1|p' | sort -u |
            while IFS= read -r tool; do
              if [ -d "tools/$tool" ] && [ ! -f "tools/$tool/test/ACTION-LEVEL" ]; then
                printf '%s\n' "$tool"
              fi
            done |
            jq -R . | jq -sc .)
          echo "tools=$TOOLS" >> "$GITHUB_OUTPUT"
          echo "changed tool suites: $TOOLS"

  tools:
    needs: changes
    if: needs.changes.outputs.tools != '[]'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.changes.outputs.tools) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ${{ matrix.tool }} suite
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          if [ ! -x "tools/$TOOL/test/run.sh" ]; then
            echo "::error::tools/$TOOL has no executable test/run.sh"; exit 1
          fi
          "tools/$TOOL/test/run.sh"
