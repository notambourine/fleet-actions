name: release

on:
  push:
    tags: ["v1.*"]

permissions:
  contents: write

concurrency:
  group: release-v1
  cancel-in-progress: false

jobs:
  self-test:
    permissions:
      contents: read
    uses: ./.github/workflows/self-test.yml

  release:
    needs: self-test
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: validate, publish, and promote v1
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ ! "$TAG" =~ ^v1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable v1.N.P tag, got $TAG"; exit 1
          fi
          TAG_SHA=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          if [ "$TAG_SHA" != "$SHA" ]; then
            echo "::error::$TAG no longer points to $SHA"; exit 1
          fi
          STATUS=$(gh api "repos/$REPO/compare/$SHA...main" --jq .status)
          if [ "$STATUS" != ahead ] && [ "$STATUS" != identical ]; then
            echo "::error::$SHA is not on main"; exit 1
          fi
          RELEASES=$(gh api --paginate "repos/$REPO/releases" | jq -s 'add')
          PUBLISHED=$(jq -r '.[] | select(.draft == false and .prerelease == false) |
            .tag_name | select(test("^v1\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))' <<<"$RELEASES")
          # Lexical comparison does not order v1.9.0 and v1.10.0 correctly.
          LATEST=$(printf '%s\n%s\n' "$TAG" "$PUBLISHED" | grep . | sort -V | tail -1)
          if [ "$LATEST" != "$TAG" ]; then
            echo "Skipping $TAG: $LATEST is already published"; exit 0
          fi

          RELEASE=$(jq --arg tag "$TAG" '.[] | select(.tag_name == $tag)' <<<"$RELEASES")
          if [ -n "$RELEASE" ]; then
            if ! jq -e '.draft == false and .prerelease == false' <<<"$RELEASE" >/dev/null; then
              echo "::error::$TAG exists as a draft or prerelease"; exit 1
            fi
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --generate-notes --title "$TAG"
          fi

          REF_EXISTS=$(gh api "repos/$REPO/git/matching-refs/tags/v1" \
            --jq 'any(.[]; .ref == "refs/tags/v1")')
          if [ "$REF_EXISTS" = true ]; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/v1" -f sha="$SHA" -F force=true
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/v1 -f sha="$SHA"
          fi
          echo "v1 -> $SHA ($TAG)"
