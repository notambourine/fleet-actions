name: runner-tier
description: >-
  Fail a job that asks for ubuntu-latest and needs nothing it provides over ubuntu-slim.
  Cost gate, read offline from the workflow files.
author: NoTambourine LLC
branding:
  icon: dollar-sign
  color: gray-dark
inputs:
  files:
    description: >-
      Workflow paths to read, repo-relative, one per line. Empty reads every file in
      .github/workflows.
    default: ""
  exclude:
    description: >-
      Jobs held out of the rule, one glob per line matched against the JOB KEY. Prefer a
      comment naming ubuntu-slim on the job's runs-on, which keeps the reason beside the
      job; this input is for a pattern spanning jobs a caller does not own.
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RUNNER_TIER_FILES: ${{ inputs.files }}
        RUNNER_TIER_EXCLUDE: ${{ inputs.exclude }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/check-runner-tier.sh"
