name: self-test

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 11 * * 1,4"

permissions:
  contents: read

jobs:
  fleet-ci:
    permissions:
      contents: read
    uses: ./.github/workflows/fleet-ci.yml
    with:
      dash-exclude-defaults: false
      guarddog: true # Opt-in for callers, so only the self-test covers the gate.
      runner-tier: true # Opt-in for callers.

  betterleaks-self-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/betterleaks

  actionlint-planted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plant invalid workflow
        run: |
          mkdir -p planted
          # Avoid expressions; the runner expands them before writing the fixture.
          cat > planted/bad.yml <<'EOF'
          on: pushh
          jobs:
            bad:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                  with:
                    no-such-input: true
          EOF
      - id: lint
        continue-on-error: true
        uses: ./tools/actionlint
        with:
          files: planted/bad.yml
          shellcheck: "false"
          pyflakes: "false"
      - name: Assert lint failure
        env:
          OUTCOME: ${{ steps.lint.outcome }}
          RESULT: ${{ steps.lint.outputs.result }}
          COUNT: ${{ steps.lint.outputs.problem-count }}
        run: |
          echo "outcome=$OUTCOME result=$RESULT problems=$COUNT"
          [ "$OUTCOME" = failure ] || { echo "::error::action passed a planted error"; exit 1; }
          [ "$RESULT" = problems-found ] || { echo "::error::result was $RESULT, not problems-found"; exit 1; }
          [ "${COUNT:-0}" -ge 1 ] || { echo "::error::problem-count was '$COUNT'"; exit 1; }
      - name: Plant policy violations
        run: |
          cat > planted/policy.yml <<'EOF'
          on: push
          jobs:
            uncapped:
              runs-on: ubuntu-latest
              timeout-minutes: 120
              steps:
                - run: echo hi
          EOF
          cat > planted/policy-config.yml <<'EOF'
          policy:
            require-permissions: {scope: job}
            require-job-timeout: {min-minutes: 5, max-minutes: 15}
          EOF
      - id: policy
        continue-on-error: true
        uses: ./tools/actionlint
        with:
          files: planted/policy.yml
          config-file: planted/policy-config.yml
          shellcheck: "false"
          pyflakes: "false"
      - name: Assert policy findings
        env:
          OUTCOME: ${{ steps.policy.outcome }}
          OUTPUT: ${{ steps.policy.outputs.output }}
        run: |
          printf '%s\n' "$OUTPUT"
          [ "$OUTCOME" = failure ] || { echo "::error::policy passed a job with no permissions and a 120m timeout"; exit 1; }
          printf '%s' "$OUTPUT" | grep -q permissions || { echo "::error::no permissions finding"; exit 1; }
          printf '%s' "$OUTPUT" | grep -q timeout || { echo "::error::no timeout finding"; exit 1; }

  tools:
    # ubuntu-slim lacks the cores needed to run tool suites concurrently.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run changed tool suites
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            CHANGED=$(git ls-files)
          else
            CHANGED=$(git diff --no-renames --name-only "$BASE" HEAD)
          fi
          TOOLS=$(printf '%s\n' "$CHANGED" |
            sed -n 's|^tools/\([^/]*\)/.*|\1|p' | sort -u |
            while IFS= read -r tool; do
              if [ -d "tools/$tool" ] && [ ! -f "tools/$tool/test/ACTION-LEVEL" ]; then
                printf '%s\n' "$tool"
              fi
            done)
          if [ -z "$TOOLS" ]; then
            echo "changed tool suites: none"
            exit 0
          fi
          printf 'changed tool suites:\n%s\n' "$TOOLS"
          PIDS=()
          while IFS= read -r tool; do
            if [ ! -x "tools/$tool/test/run.sh" ]; then
              echo "::error::tools/$tool has no executable test/run.sh"; exit 1
            fi
            "tools/$tool/test/run.sh" &
            PIDS+=("$!")
          done <<< "$TOOLS"
          FAILED=0
          for pid in "${PIDS[@]}"; do
            wait "$pid" || FAILED=1
          done
          exit "$FAILED"
